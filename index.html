    .concat(D.pension.length || D.plans.length ? ['', 'Savings plan:'].concat(D.pension.length ? ['· Extra pension from pay: ' + D.pension.map((x) => gbp(x[0]) + ' a month ' + x[2]).join('; ')] : [], D.plans.map((m) => '· ' + m.title + ': ' + gbp(m.amount) + ' (' + planEN(m, k) + ')')) : [])
    .concat(['', 'Tax, estimated:'], D.tax.map((t) => '· ' + tyPlain(t.y) + ': taxable interest about ' + gbp(t.interest) + ', tax-free returns about ' + gbp(t.free) + (t.tax !== null ? ', tax about ' + gbp(t.tax) : '')), ['· From April 2027, savings interest is taxed at 24%, 44% and 49%.'])
    .concat(D.retire ? ['', 'Looking further ahead, in today’s money' + (D.infl > 0 ? ' (prices rising ' + pct(D.infl, 1) + ' a year)' : '') + ':', '· Retiring at ' + D.retire.age + ' in ' + D.retire.year + ': savings and pensions about ' + about(D.retire.pots) + ', income about ' + about(D.retire.income) + ' a year']
      .concat(D.infl > 0 ? ['· In ' + D.retire.year + ' pounds: savings and pensions about ' + about(D.retire.potsLater) + ', income about ' + about(D.retire.incomeLater) + ' a year'] : []) : [])
    .concat(['', 'What these accounts are:'], D.glossary.map(([, e, , x]) => '· ' + e + ': ' + x))
    .concat(['', 'Estimates, before tax. Investments can go down as well as up.']);
  return cn.join('\n') + '\n\n' + en.join('\n');
}

// The picture: an ivory page with a dark green header like the app's icon, in the Paper style whatever the app's
// look. It's drawn twice: once to measure its height, then at full size.
function drawReport(D) {
  const W = 360, P = 22, CW = W - 2 * P, k = monthKey();
  const SANS = '-apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Microsoft YaHei", sans-serif';
  const SERIF = 'ui-serif, "New York", Georgia, "Songti SC", serif';
  const ink = '#1C1F1A', ink2 = '#454A42', muted = '#656B61', line = '#E6E2D8', cream = '#FBF9F4', tile = '#F2EEE4', brand = '#2D6945', soft = 'rgba(251, 249, 244, .76)';
  const ramp = { cash: '#9BB785', fixed: '#699566', invest: '#3D724F', pension: '#1D4E3C' };
  const paint = (x) => {
    let y = 0;
    const font = (w, s, f) => { x.font = w + ' ' + s + 'px ' + (f || SANS); };
    const text = (s, X, Y, col, align) => { x.fillStyle = col; x.textAlign = align || 'left'; x.fillText(s, X, Y); return x.measureText(s).width; };
    const fit = (s, w) => { if (x.measureText(s).width <= w) return s; while (s.length > 1 && x.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; };
    const rule = (Y) => { x.fillStyle = line; x.fillRect(P, Y, CW, 1); };
    const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
    const dot = (X, Y, r, col) => { x.beginPath(); x.arc(X, Y, r, 0, Math.PI * 2); x.fillStyle = col; x.fill(); };
    // Lines that fit the page: Chinese breaks between characters, English between words.
    const wrap = (s, w) => {
      const out = [];
      let cur = '';
      (s.match(/[⺀-鿿＀-￯]|[^\s⺀-鿿＀-￯]+\s*|\s+/g) || []).forEach((tk) => {
        if (cur && x.measureText(cur + tk).width > w && !/^[，。；：、）！？]/.test(tk)) { out.push(cur.trimEnd()); cur = tk.trimStart(); } else cur += tk;
      });
      if (cur.trim()) out.push(cur.trimEnd());
      return out;
    };
    const para = (s, col, size, lh) => { font('400', size); wrap(s, CW).forEach((l) => { text(l, P, y, col); y += lh; }); };
    const head = (cn, en) => { y += 40; font('700', 16); const w = text(cn, P, y, ink); font('500', 12); text(en, P + w + 8, y, muted); y += 14; };
    const pair = (cn, en, value) => { font('500', 13.5); text(cn, P, y, ink); font('400', 11); text(en, P, y + 16, muted); font('600', 13.5); text(value, W - P, y, ink, 'right'); y += 40; };

    // Header: the title, the date and the total, with the block bar graph from the app's icon.
    const hh = D.change ? 194 : 174;
    x.fillStyle = cream; x.fillRect(0, 0, W, 100000);
    const hg = x.createLinearGradient(0, 0, 0, hh);
    hg.addColorStop(0, '#12301F'); hg.addColorStop(1, '#07130C');
    x.fillStyle = hg; x.fillRect(0, 0, W, hh);
    const glow = x.createRadialGradient(W - 70, 70, 0, W - 70, 70, 150);
    glow.addColorStop(0, 'rgba(43, 208, 126, .28)'); glow.addColorStop(1, 'rgba(43, 208, 126, 0)');
    x.fillStyle = glow; x.fillRect(0, 0, W, hh);
    [0.42, 0.3, 0.6, 0.78, 1].forEach((f, i) => {
      const bw = 18, X = W - 26 - (4 - i) * 26 - bw, h = 96 * f, Y = hh - 24 - h;
      const bg = x.createLinearGradient(0, hh - 120, 0, hh - 24);
      bg.addColorStop(0, 'rgba(180, 247, 207, .9)'); bg.addColorStop(1, 'rgba(28, 143, 87, .55)');
      rr(X, Y, bw, h, 5); x.fillStyle = bg; x.fill();
    });
    font('600', 18); const tw = text('财务快照', P, 40, cream);
    font('500', 13); text('Money snapshot', P + tw + 9, 40, soft);
    font('400', 12); text(cnDate(D.date) + ' · ' + enDate(D.date), P, 61, soft);
    font('600', 42, SERIF); text(gbp(D.t), P, 124, cream);
    font('500', 12); text('总资产 · Total', P, 149, soft);
    if (D.change) { font('600', 12); text(gbpSigned(D.change.v) + '  较' + cnDate(D.change.since) + ' · since ' + enDate(D.change.since, true), P, 174, '#9FE5BD'); }

    // Four key figures.
    y = hh + 20;
    const tiles = [['每月收益', 'A month', gbp(D.earn)], ['免税比例', 'Tax-free', pct(D.taxFree)], ['一年后', 'In a year', '≈ ' + about(D.y1)], ['三年后', 'In 3 years', '≈ ' + about(D.y3)]];
    const tw2 = (CW - 10) / 2;
    tiles.forEach(([c, e, v], i) => {
      const X = P + (i % 2) * (tw2 + 10), Y = y + Math.floor(i / 2) * 70;
      rr(X, Y, tw2, 62, 10); x.fillStyle = tile; x.fill();
      font('500', 12); const w = text(c, X + 12, Y + 22, ink2);
      font('400', 10.5); text(e, X + 12 + w + 6, Y + 22, muted);
      font('600', 20, SERIF); text(v, X + 12, Y + 49, ink);
    });
    y += 132;

    // The split, as a bar and a row for each group.
    head('资产分布', 'How it’s split');
    const n = D.groups.length, avail = CW - 2 * (n - 1);
    x.save(); x.beginPath(); x.rect(P, y, CW, 10); x.clip();
    let bx = P;
    D.groups.forEach((g) => { const w = Math.max(5, avail * g.v / D.t); x.fillStyle = ramp[g.id]; x.fillRect(bx, y, w, 10); bx += w + 2; });
    x.restore();
    y += 34;
    D.groups.forEach((g, i) => {
      if (i) rule(y - 22);
      dot(P + 5, y - 4.5, 5, ramp[g.id]);
      font('500', 14); text(CN_GROUP[g.id], P + 18, y, ink);
      font('400', 11.5); text(g.name, P + 18, y + 16, muted);
      font('600', 14); text(gbp(g.v), W - P, y, ink, 'right');
      font('400', 11.5); text(share(g.v / D.t), W - P, y + 16, muted, 'right');
      y += 44;
    });
    y -= 26;

    // The next three years, month by month.
    head('未来三年', 'The next three years');
    const vals = D.path, top = y + 26, ch = 118, bot = top + ch;
    const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.14 || hi * 0.02 || 1;
    const X = (i) => P + 6 + i / Math.max(1, vals.length - 1) * (CW - 12), Y = (v) => bot - (v - lo + pad) / (hi - lo + 2 * pad) * ch;
    const curvePath = () => { x.beginPath(); x.moveTo(X(0), Y(vals[0])); for (let i = 1; i < vals.length; i++) x.quadraticCurveTo(X(i - 1), Y(vals[i - 1]), (X(i - 1) + X(i)) / 2, (Y(vals[i - 1]) + Y(vals[i])) / 2); x.lineTo(X(vals.length - 1), Y(vals[vals.length - 1])); };
    x.fillStyle = line; x.fillRect(P, bot, CW, 1);
    curvePath(); x.lineTo(X(vals.length - 1), bot); x.lineTo(X(0), bot); x.closePath();
    const ag = x.createLinearGradient(0, top, 0, bot);
    ag.addColorStop(0, 'rgba(45, 105, 69, .22)'); ag.addColorStop(1, 'rgba(45, 105, 69, 0)');
    x.fillStyle = ag; x.fill();
    curvePath(); x.strokeStyle = brand; x.lineWidth = 2.2; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke();
    [0, 12, 24, 36].filter((i) => i < vals.length).forEach((i, j, all) => {
      const al = j === 0 ? 'left' : j === all.length - 1 ? 'right' : 'center';
      dot(X(i), Y(vals[i]), 4.5, brand); dot(X(i), Y(vals[i]), 2.4, cream);
      font('600', 11.5); text(gbpShort(vals[i]), X(i) + (al === 'left' ? -4 : al === 'right' ? 4 : 0), Y(vals[i]) - (j === 0 ? 22 : 11), ink, al);
      font('400', 10.5); text(['现在 Now', '1年 1 year', '2年 2 years', '3年 3 years'][j], X(i) + (al === 'left' ? -4 : al === 'right' ? 4 : 0), bot + 16, muted, al);
    });
    y = bot + 44;
    para('每月预测，包括利息、投资收益和计划中的存款。', ink2, 12, 18);
    para('Month by month, with interest, growth and planned savings.', muted, 11, 16);
    if (D.infl > 0) {
      y += 6;
      para('按每年 ' + pct(D.infl, 1) + ' 的通胀，三年后的 ' + about(D.y3) + ' 约相当于今天的 ' + about(D.y3Today) + '。', ink2, 12, 18);
      para('With prices rising ' + pct(D.infl, 1) + ' a year, ' + about(D.y3) + ' in three years is worth about ' + about(D.y3Today) + ' today.', muted, 11, 16);
    }
    y -= 16;

    // Every account, by group.
    head('账户明细', 'Every account, ' + D.pots.length);
    y += 22;
    D.groups.forEach((g) => {
      const ps = D.pots.filter((p) => g.types.includes(p.type));
      rr(P, y - 17, CW, 28, 7); x.fillStyle = tile; x.fill();
      dot(P + 13, y - 3, 4.5, ramp[g.id]);
      font('600', 13); const w = text(CN_GROUP[g.id], P + 24, y + 1.5, ink);
      font('400', 11); text(g.name, P + 24 + w + 7, y + 1.5, muted);
      font('600', 13); text(gbp(sum(ps, (p) => p.balance)), W - P - 10, y + 1.5, ink, 'right');
      y += 36;
      ps.forEach((p, i) => {
        if (i) rule(y - 19);
        font('600', 13.5); const vw = text(gbp(p.balance), W - P, y, ink, 'right');
        font('500', 13.5); text(fit(potName(p), CW - vw - 12), P, y, ink);
        font('400', 11.5); text(fit(potCN(p), CW), P, y + 18, ink2);
        font('400', 10.5); text(fit(potEN(p), CW), P, y + 33, muted);
        y += 56;
      });
      y += 10;
    });
    y -= 40;

    // Where the money is held.
    head('按机构', 'By provider');
    y += 20;
    const most = D.providers.length ? D.providers[0].value : 1;
    D.providers.forEach((r) => {
      font('500', 13.5); text(fit(r.label, CW - 110), P, y, ink);
      font('600', 13.5); text(gbp(r.value), W - P, y, ink, 'right');
      rr(P, y + 8, CW, 5, 2.5); x.fillStyle = '#E2ECE3'; x.fill();
      rr(P, y + 8, Math.max(5, CW * r.value / most), 5, 2.5); x.fillStyle = brand; x.fill();
      y += 38;
    });
    y -= 22;

    // What matures, and where the money goes next.
    if (D.soon.length) {
      head('到期安排', 'What matures, and where it goes');
      y += 20;
      D.soon.forEach((nt, i) => {
        if (i) rule(y - 19);
        const d = parseD(nt.pot.maturity);
        font('400', 11); text(cnDate(d) + ' · ' + enDate(d, true), P, y, muted);
        font('600', 13.5); const vw = text(gbp(nt.amount), W - P, y + 19, ink, 'right');
        font('500', 13.5); text(fit(potName(nt.pot), CW - vw - 12), P, y + 19, ink);
        font('400', 11); text(fit('然后转入 Then to: ' + potName(nt.to), CW), P, y + 36, ink2);
        y += 60;
      });
      y -= 30;
    }

    // Plans: extra pension from pay and the money moves.
    if (D.pension.length || D.plans.length) {
      head('储蓄计划', 'Savings plan');
      y += 20;
      const rows = (D.pension.length ? [['从工资额外存入养老金', 'Extra pension from pay', gbp(D.pension[0][0]) + '/月', D.pension.map((x2) => x2[1] + '每月 ' + gbp(x2[0])).join('；'), D.pension.map((x2) => gbp(x2[0]) + ' a month ' + x2[2]).join('; ')]] : [])
        .concat(D.plans.map((m) => [m.title, '', gbp(m.amount), planCN(m, k), planEN(m, k)]));
      rows.forEach(([t1, t2, v, c, e], i) => {
        if (i) rule(y - 19);
        font('600', 13.5); const vw = text(v, W - P, y, ink, 'right');
        font('500', 13.5); wrap(t1, CW - vw - 14).forEach((l) => { text(l, P, y, ink); y += 19; });
        if (t2) { font('400', 11); text(t2, P, y - 2, muted); y += 15; }
        font('400', 11.5); wrap(c, CW).forEach((l) => { text(l, P, y, ink2); y += 16; });
        font('400', 10.5); wrap(e, CW).forEach((l) => { text(l, P, y, muted); y += 15; });
        y += 22;
      });
      y -= 40;
    }

    // Tax on savings interest, this tax year and next.
    head('税务', 'Tax, estimated');
    y += 20;
    const c1 = W - P - 92;
    font('600', 11.5); text(tyPlain(D.tax[0].y), c1, y, muted, 'right'); text(tyPlain(D.tax[1].y), W - P, y, muted, 'right');
    y += 24;
    [['应税利息', 'Taxable interest', 'interest'], ['免税收益', 'Tax-free returns', 'free'], ['预计税额', 'Estimated tax', 'tax']].forEach(([c, e, key], i) => {
      if (key === 'tax' && D.tax.every((t) => t.tax === null)) return;
      if (i) rule(y - 19);
      font('500', 13.5); text(c, P, y, ink); font('400', 11); text(e, P, y + 16, muted);
      font('600', 13.5); D.tax.forEach((t, j) => text(t[key] === null ? '—' : gbp(t[key]), j ? W - P : c1, y, ink, 'right'));
      y += 40;
    });
    y += 2;
    para('2027年4月起，储蓄利息税率升至 24%、44% 和 49%。ISA、有奖债券奖金和国债的价格上涨部分免税。', ink2, 12, 18);
    para('From April 2027 savings interest is taxed at 24%, 44% and 49%. ISAs, Premium Bond prizes and gilt price gains are tax-free.', muted, 11, 16);
    y -= 16;

    // The long run, in today's money.
    if (D.retire) {
      head('长期展望', 'Looking further ahead');
      y += 20;
      pair('退休', 'Retire', D.retire.age + '岁 · ' + D.retire.year);
      pair('届时储蓄和养老金', 'Savings and pensions then', '≈ ' + about(D.retire.pots));
      pair('每年收入', 'Income a year', '≈ ' + about(D.retire.income));
      if (D.infl > 0) { pair('折合' + D.retire.year + '年的英镑', 'In ' + D.retire.year + ' pounds', '≈ ' + about(D.retire.potsLater)); pair('当年每年收入', 'Income a year, ' + D.retire.year + ' pounds', '≈ ' + about(D.retire.incomeLater)); }
      y += 2;
      para('按今日币值估算' + (D.infl > 0 ? '（假设每年通胀 ' + pct(D.infl, 1) + '，上面最后两行是折合' + D.retire.year + '年的英镑）' : '') + '，税前。收入包括保证养老金、国家养老金，以及每年从储蓄中提取 ' + pct(D.retire.draw, 1) + '。', ink2, 12, 18);
      para('In today’s money' + (D.infl > 0 ? ', with prices rising ' + pct(D.infl, 1) + ' a year (the last two rows are in ' + D.retire.year + ' pounds)' : '') + ', before tax: the guaranteed pension, the State Pension and ' + pct(D.retire.draw, 1) + ' a year drawn from savings.', muted, 11, 16);
      y -= 16;
    }

    // What each kind of account is.
    head('名词解释', 'What these accounts are');
    y += 22;
    D.glossary.forEach(([c, e, cx, ex], i) => {
      if (i) rule(y - 22);
      font('700', 14); const w = text(c, P, y, ink); font('600', 12); text(e, P + w + 8, y, muted);
      y += 21;
      para(cx, ink2, 12.5, 19);
      y += 2;
      para(ex, muted, 11, 16);
      y += 26;
    });
    y -= 10;
    rule(y); y += 24;
    para('以上为估算，未扣税；投资价值可能上下波动。数字来自' + cnDate(D.date) + '的账户余额。', muted, 11, 16);
    para('Estimates, before tax, from balances on ' + enDate(D.date) + '. Investments can go down as well as up.', muted, 11, 16);
    return y + 14;
  };
  const probe = document.createElement('canvas');
  probe.width = probe.height = 8;
  const H = Math.ceil(paint(probe.getContext('2d')));
  // Sharp on a phone, but within the size iPhones allow for one picture.
  const K = Math.min(3, Math.sqrt(15e6 / (W * H)), 16000 / H), cv = document.createElement('canvas');
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  const x = cv.getContext('2d');
  x.scale(cv.width / W, cv.height / H);
  paint(x);
  return { cv, W, H };
}

// A one-page PDF holding the picture, written by hand so no library is needed.
function pdfOf(jpeg, wPx, hPx, wPt, hPt) {
  const enc = new TextEncoder(), parts = [], offs = [], draw = 'q ' + wPt + ' 0 0 ' + hPt + ' 0 0 cm /Im0 Do Q';
  let n = 0;
  const put = (b) => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); n += u.length; };
  const obj = (i, body) => { offs[i] = n; put(i + ' 0 obj\n' + body + '\nendobj\n'); };
  put('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + wPt + ' ' + hPt + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = n;
  put('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
  put(jpeg); put('\nendstream\nendobj\n');
  obj(5, '<< /Length ' + draw.length + ' >>\nstream\n' + draw + '\nendstream');
  const xref = n;
  put('xref\n0 6\n0000000000 65535 f \n' + [1, 2, 3, 4, 5].map((i) => String(offs[i]).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}
function makePicture(D) {
  const { cv, W, H } = drawReport(D), name = 'money-report-' + localISO(D.date);
  cv.toBlob((b) => {
    if (!b) return;
    if (shareUrl) URL.revokeObjectURL(shareUrl);
    shareUrl = URL.createObjectURL(b);
    shareFile = new File([b], name + '.png', { type: 'image/png' });
    paintShare();
    cv.toBlob((j) => {
      if (j) j.arrayBuffer().then((buf) => { sharePdf = new File([pdfOf(new Uint8Array(buf), cv.width, cv.height, W, H)], name + '.pdf', { type: 'application/pdf' }); paintShare(); });
    }, 'image/jpeg', 0.9);
  }, 'image/png');
}
function paintShare() {
  const box = $('#sharebox');
  if (!box) return;
  $$('#sheet [data-act="share-mode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-id') === shareMode)));
  const ready = shareMode === 'pdf' ? sharePdf : shareFile;
  box.innerHTML = shareMode === 'text' ? '<pre class="share">' + esc(shareText) + '</pre>'
    : ready ? (shareMode === 'pdf' ? '<p class="note">The same long page as a PDF, ' + Math.max(1, Math.round(sharePdf.size / 1024)) + ' KB, for printing or keeping.</p>' : '') + '<img class="sharepic" src="' + shareUrl + '" alt="Your money report as a long picture, in Chinese and English">'
    : '<p class="note">Drawing the report…</p>';
  const c = $('#sharecopy');
  if (c) c.hidden = shareMode !== 'text';
}
function openShare() {
  if (!state.pots.length) { toast('Add your pots first'); return; }
  const D = summary();
  shareText = summaryText(D); shareFile = null; sharePdf = null;
  openSheet('Share with family', '<p class="note">A full report in Chinese and English: every account, the next three years, what matures, your plans, tax, and what each kind of account is. Never account numbers.</p>' +
    seg('share-mode', [['picture', 'Picture'], ['pdf', 'PDF'], ['text', 'Text']], shareMode, 'Share as') +
    '<div class="row-actions"><button type="button" class="btn primary" data-act="share-go">' + IC.share + 'Share</button><button type="button" class="btn quiet" data-act="share-copy" id="sharecopy">Copy text</button></div><div id="sharebox"></div>', () => {}, { label: 'Done', noCancel: true });
  paintShare();
  makePicture(D);
}
const copyText = (t) => {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Press and hold the text to copy it'));
  else toast('Press and hold the text to copy it');
};
function shareGo() {
  const file = shareMode === 'pdf' ? sharePdf : shareMode === 'picture' ? shareFile : null;
  if (shareMode !== 'text' && !file) { toast('Still drawing the report'); return; }
  const data = file ? { files: [file] } : { title: 'Money snapshot 财务快照', text: shareText };
  if (navigator.share && (!file || (navigator.canShare && navigator.canShare(data)))) {
    navigator.share(data).catch((err) => { if (!err || err.name !== 'AbortError') toast(file ? 'Press and hold the picture to save it' : 'Try Copy text instead'); });
  } else if (file) {
    const a = document.createElement('a'), u = URL.createObjectURL(file);
    a.href = u; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1500);
  } else copyText(shareText);
}

/* ---------- backup ---------- */
async function exportData() {
  const name = 'money-backup-' + localISO() + '.json';
  const data = JSON.stringify({ ...state, lastExport: localISO() }, null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  let shared = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Money Snapshot backup' });
      shared = true;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  if (!shared) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  state.lastExport = localISO(); save(); render();
  toast('Backup made');
}

function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = normalise(JSON.parse(String(r.result))); } catch (err) { toast('That file isn’t a Money Snapshot backup'); return; }
    const apply = () => { state = d; if (location.hash !== '#home') location.hash = '#home'; toast('Imported ' + d.pots.length + ' pots'); };
    if (!state || state.example) { apply(); save(); render(true); return; }
    confirmSheet('Replace your data?', 'This replaces everything in the app with "' + file.name + '": ' + d.pots.length + ' pots and ' + d.snapshots.length + ' updates. Back up first if you might need what is here now.', 'Replace', apply);
  };
  r.readAsText(file);
}

function exampleData() {
  const d = blank(), y = new Date().getFullYear();
  d.example = true;
  Object.assign(d.settings, {
    name: 'Alex', birthYear: 1990, birthMonth: 6, retireAge: 65, takeHome: 2600, fixedCosts: 1500, extraPensionMonthly: 200,
    emergencyMonths: 6, targetShares: 0.6, planStartDate: localISO(), planStartShares: 0.33, targetSharesBy: (y + 2) + '-04-30',
    newSavingsPerYear: 6000, targetIncome: 40000, dbPension: 1500, dbLump: 4500, dbAccrual: 600, dbLumpAccrual: 1800, dbAge: 67, leaveDbAge: 65,
    pensionThisYear: 1200, pensionPerYearA: 2400, pensionSwitchYear: y + 5, pensionPerYearB: 3000, taxPayThis: 45000, taxYearOf: taxYearStart().getFullYear(),
  });
  d.pots = [
    { id: 'ex1', name: 'Easy access saver', provider: 'Example Bank', type: 'cash', balance: 12000, rate: 0.042, rateNote: 'variable', monthly: true },
    { id: 'ex2', name: 'One-year fixed saver', provider: 'Example Building Society', type: 'fixed', balance: 15000, rate: 0.045, rateNote: 'fixed', maturity: (y + 1) + '-03-31', thenTo: 'ex3' },
    { id: 'ex3', name: 'Stocks & shares ISA', provider: 'Example Platform', type: 'shares', balance: 18000, rate: 0.06, rateNote: 'expected', taxFree: true },
    { id: 'ex4', name: 'Premium Bonds', provider: 'NS&I', type: 'premium', balance: 5000, rate: 0.04, rateNote: 'average prize rate', taxFree: true },
    { id: 'ex5', name: 'Workplace pension pot', provider: 'Example Pension', type: 'pension', balance: 9000, rate: 0.06, rateNote: 'expected', taxFree: true },
  ].map((p) => ({ monthly: false, maturity: '', offerEnds: '', cap: 0, taxFree: false, notes: '', rateAfter: null, thenTo: '', coupon: null, nominal: 0, aka: '', ...p }));
  // A few months of made-up history, so the charts have something to show.
  d.snapshots = [5, 4, 3, 2, 1, 0].map((n) => {
    const at = new Date(); at.setDate(1); at.setMonth(at.getMonth() - n);
    return { date: n ? localISO(at) : localISO(), balances: Object.fromEntries(d.pots.map((p) => [p.id, Math.round(p.balance * (1 - n * 0.011 + (n % 2) * 0.004))])) };
  });
  d.moves = [
    { id: 'exm1', title: 'Pay into the ISA', amount: 500, note: 'From Example Bank to Example Platform', start: monthKey(), end: '', from: 'pay', to: 'ex3' },
    { id: 'exm2', title: 'Move leftover pay to the easy access saver', amount: 400, note: 'After rent and bills', start: monthKey(), end: '', from: 'pay', to: 'ex1' },
  ];
  return d;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act) {
    case 'close': closeSheet(); break;
    case 'update': openUpdate(); break;
    case 'add-pot': openPot(null); break;
    case 'edit-pot': openPot(id); break;
    case 'del-pot': {
      const p = state.pots.find((x) => x.id === id);
      if (p) confirmSheet('Delete ' + p.name + '?', 'This removes the pot. Past updates keep their totals.', 'Delete', () => { state.pots = state.pots.filter((x) => x.id !== id); toast('Deleted'); });
      break;
    }
    case 'add-move': openMove(null); break;
    case 'edit-move': openMove(id); break;
    case 'del-move': {
      const m = state.moves.find((x) => x.id === id);
      if (m) confirmSheet('Delete this move?', m.title, 'Delete', () => { state.moves = state.moves.filter((x) => x.id !== id); toast('Deleted'); });
      break;
    }
    case 'toggle-move': {
      const k = monthKey(), set = doneSet(k);
      if (set.has(id)) set.delete(id); else set.add(id);
      state.movesDone[k] = Array.from(set);
      save(); render();
      break;
    }
    case 'split': ui.split = id; saveUi(); render(); break;
    case 'theme': ui.theme = id; saveUi(); applyTheme(); render(); break;
    case 'taxyr': ui.taxYear = id; saveUi(); render(true); break;
    case 'edit-tax': openTax(); break;
    case 'paste-clip': pasteClip(); break;
    case 'detect': detectBalances(); break;
    case 'share': openShare(); break;
    case 'share-mode': shareMode = id; paintShare(); break;
    case 'share-go': shareGo(); break;
    case 'share-copy': copyText(shareText); break;
    case 'fc': ui.fc = id; saveUi(); render(true); break;
    case 'range': ui.range = Number(id) || 36; ui.allMonths = false; saveUi(); render(true); break;
    case 'month': openMonth(id); break;
    case 'checks': openChecks(); break;
    case 'table': openTable(); break;
    case 'how': openHow(); break;
    case 'how-retire': openHowRetire(); break;
    case 'go': location.hash = '#' + id; break;
    case 'edit-monthly': openSettings(['Each month']); break;
    case 'edit-plan': openSettings(['Plan', 'Guaranteed pension', 'Pension pot contributions', 'State Pension', 'Inflation', 'Growth above inflation']); break;
    case 'edit-settings': openSettings(null); break;
    case 'edit-isa': openIsa(); break;
    case 'add-event': openEvent(); break;
    case 'toggle-event': {
      const ev = state.events.find((x) => x.id === id);
      if (ev) { ev.done = !ev.done; save(); render(); }
      break;
    }
    case 'del-event': state.events = state.events.filter((x) => x.id !== id); save(); render(); break;
    case 'del-snap': confirmSheet('Delete this update?', 'The update from ' + fmtDate(id) + ' will be removed from your history.', 'Delete', () => { state.snapshots = state.snapshots.filter((s) => s.date !== id); }); break;
    case 'export': exportData(); break;
    case 'start-blank': state = blank(); state.settings.planStartDate = localISO(); save(); location.hash = '#pots'; render(true); break;
    case 'start-example': state = exampleData(); save(); location.hash = '#home'; render(true); break;
    case 'clear-example': state = null; save(); history.replaceState(null, '', location.pathname); render(true); break;
    case 'wipe': confirmSheet('Delete everything?', 'This deletes all your pots, history and settings from this device. It cannot be undone, so back up first if you might need them.', 'Delete everything', () => { state = null; history.replaceState(null, '', location.pathname); }); break;
    default: break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches && el.matches('input[type=file][data-act="import-file"]')) {
    const f = el.files && el.files[0];
    el.value = '';
    if (f) importFile(f);
  } else if (el.matches && el.matches('#sheet select.pick')) pickPot(el);
  else if (el.matches && el.matches('#sheet select[name="type"]')) {
    const g = $('#sheet .gilt-only'), m = $('#sheet .mature-only');
    if (g) g.hidden = el.value !== 'gilt';
    if (m) m.hidden = !MATURES.has(el.value);
  }
});
// Pasting into the box finds the balances straight away.
document.addEventListener('paste', (e) => { if (e.target.matches && e.target.matches('#sheet textarea[name="paste"]')) setTimeout(detectBalances, 0); });
window.addEventListener('hashchange', () => { render(true); window.scrollTo(0, 0); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!sheet.hidden) closeSheet(); endScrub(); return; }
  const svg = document.activeElement;
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && svg && svg.matches && svg.matches('svg[data-chart]')) {
    const c = CH[svg.getAttribute('data-chart')];
    if (!c) return;
    e.preventDefault();
    mark(svg, scrub && scrub.svg === svg ? scrub.i + (e.key === 'ArrowRight' ? 1 : -1) : c.n - 1);
  }
});

let toastTimer = null;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}

/* ---------- start ---------- */
applyTheme();
render(true);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
