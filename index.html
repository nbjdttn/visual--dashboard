  } else if (p.mode === 'wipe') {
    lockEl.innerHTML = top + '<h2 id="lockt">Delete everything?</h2><p class="lockmsg">Your pots, history, settings, restore points, passcode and API key will be deleted from this phone. Then you can open a copy of your figures that you saved to Files.</p><div class="stack">' +
      '<button type="button" class="btn danger" data-k="wipe-go">Delete everything</button><button type="button" class="btn quiet" data-k="back">Back</button></div></div>';
  } else {
    const title = p.mode === 'unlock' ? 'Enter your passcode' : p.mode === 'check' ? 'Enter your current passcode' : p.first ? 'Enter it again' : p.title || 'Choose a passcode';
    const msg = p.msg || (p.mode === 'new' && !p.first ? '6 digits, not your bank card PIN' : '');
    const left = p.mode !== 'unlock' ? '<button type="button" class="ghost" data-k="cancel">Cancel</button>'
      : faceKey() ? '<button type="button" class="ghost" data-k="face" aria-label="Unlock with Face ID">' + IC.face + '</button>' : '<span></span>';
    lockEl.innerHTML = top + '<h2 id="lockt">' + esc(title) + '</h2><p class="lockmsg' + (p.bad ? ' bad' : '') + '" role="status">' + esc(msg) + '</p>' +
      '<div class="dots" aria-hidden="true">' + '<i></i>'.repeat(6) + '</div><div class="keys">' +
      '123456789'.split('').map((d) => '<button type="button" data-k="' + d + '">' + d + '</button>').join('') + left +
      '<button type="button" data-k="0">0</button><button type="button" class="ghost" data-k="del" aria-label="Delete">' + IC.del + '</button></div>' +
      (p.mode === 'unlock' ? '<button type="button" class="linkbtn quiet" data-k="forgot">Forgot passcode?</button>' : '') + '</div>';
    padDots();
    if (p.bad) { const d = $('#lock .dots'); d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 450); p.bad = false; }
  }
  const box = $('#lock .lockp');
  if (box) box.focus();
}
function padDots() { $$('#lock .dots i').forEach((d, i) => d.classList.toggle('on', i < pad.code.length)); }
function padPress(k) {
  const p = pad;
  if (!p || p.busy || !/^(unlock|check|new)$/.test(p.mode)) return;
  if (k === 'del') p.code = p.code.slice(0, -1);
  else if (p.code.length < 6) p.code += k;
  padDots();
  if (p.code.length === 6) padSubmit(p);
}
async function padSubmit(p) {
  const code = p.code;
  p.busy = true;
  if (p.mode === 'new' && !p.first) { Object.assign(p, { first: code, code: '', msg: '', busy: false }); padPaint(); return; }
  if (p.mode === 'new' && code !== p.first) { Object.assign(p, { first: '', code: '', msg: 'Those didn’t match. Try again.', bad: true, busy: false }); padPaint(); return; }
  let ok = true;
  if (p.mode === 'new') await codeSet(code); else ok = await codeOK(code);
  if (pad !== p) return; // replaced meanwhile, for example because the app locked
  if (!ok) { Object.assign(p, { code: '', msg: 'Wrong passcode. Try again.', bad: true, busy: false }); padPaint(); return; }
  padClose();
  if (p.done) p.done();
}
function padKey(e) {
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); padPress(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); padPress('del'); }
  else if (e.key === 'Escape' && (pad.mode === 'check' || pad.mode === 'new')) { const p = pad; padClose(); if (p.back) p.back(); }
}
lockEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'), p = pad;
  if (!b || !p) return;
  const k = b.getAttribute('data-k');
  if (/^(\d|del)$/.test(k)) padPress(k);
  else if (k === 'face') faceUnlock();
  else if (k === 'cancel') { padClose(); if (p.back) p.back(); }
  else if (k === 'forgot' || k === 'wipe') { p.mode = k; padPaint(); }
  else if (k === 'back') { Object.assign(p, { mode: 'unlock', code: '', msg: '' }); padPaint(); }
  else if (k === 'wipe-go') { wipeAll(); padClose(); lockedNow = false; render(true); toast('Deleted. You can open a saved copy now.'); }
  else if (k === 'forgot-face') {
    faceCheck().catch(() => false).then((ok) => {
      if (ok && pad === p) padOpen({ mode: 'new', title: 'Choose a new passcode', done: () => { lockedNow = false; toast('New passcode saved'); }, back: lock });
    });
  }
});

function lock() {
  if (!lockConf()) return;
  lockedNow = true;
  padOpen({ mode: 'unlock', done: () => { lockedNow = false; } });
  if (document.visibilityState === 'visible') faceUnlock();
}
// Face ID over the keypad: unlocked if it recognises you, otherwise the passcode is right there.
async function faceUnlock() {
  const p = pad;
  if (!p || p.mode !== 'unlock' || !faceKey() || faceBusy) return;
  const ok = await faceCheck().catch(() => false);
  if (pad !== p) return;
  if (ok) { padClose(); lockedNow = false; } else if (!p.code) { Object.assign(p, { msg: 'Face ID didn’t unlock it.', bad: false }); padPaint(); }
}
// Away for longer than the setting, the app locks. A Face ID prompt doesn't count as being away.
document.addEventListener('visibilitychange', () => {
  const c = lockConf();
  if (!c || faceBusy || Date.now() - faceEnded < 1500) return;
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); if (!c.after && !lockedNow) lock(); return; }
  if (lockedNow) faceUnlock();
  else if (hiddenAt && Date.now() - hiddenAt >= c.after * 60000) lock();
  hiddenAt = 0;
});
let lockWiped = false;
function wipeAll() {
  lockWiped = true;
  state = null; save(); pointsClear();
  aiSave(null); chat = null; fundsSave(null);
  try { localStorage.removeItem(NEWS_KEY); } catch (e) { /* not essential */ }
  faceForget(lockConf()); lockSave(null);
  history.replaceState(null, '', location.pathname);
}

function lockSection() {
  const c = lockConf(), h = '<section class="sec"><h2>' + (faceCan || (c && c.face) ? 'Face ID and passcode' : 'Passcode') + '</h2><div class="panel pad">';
  if (!c) return h + '<p class="note">' + (faceCan ? 'Open Money Snapshot with Face ID, with a 6-digit passcode for when Face ID doesn’t work.' : 'Lock Money Snapshot with a 6-digit passcode.') + ' It asks when the app opens and when you come back to it.</p><button class="btn quiet" data-act="lock-on">' + IC.lock + (faceCan ? 'Turn on Face ID' : 'Turn on passcode') + '</button></div></section>';
  return h + '<p class="lockline">' + IC.lock + '<span>' + (c.face ? 'Face ID on, with your passcode as a backup' : 'Passcode on') + '</span></p>' +
    selectField('lock_after', 'Ask for it', String(c.after), LOCK_AFTER.map(([v, l]) => [String(v), l])) +
    '<div class="row-actions"><button class="btn quiet" data-act="lock-now">' + IC.lock + 'Lock now</button><button class="btn quiet" data-act="lock-change">Change passcode</button></div>' +
    (c.face ? '<button class="linkbtn quiet" data-act="face-off">Stop using Face ID</button>' : faceCan ? '<button class="btn quiet" data-act="face-on">' + IC.face + 'Turn on Face ID</button>' : '') +
    '<button class="linkbtn quiet" data-act="lock-off">Turn off the lock</button></div></section>';
}
function openLockOn() {
  openSheet(faceCan ? 'Face ID and passcode' : 'Passcode', (faceCan ? '<p>First choose a 6-digit passcode, for when Face ID doesn’t work. Then turn on Face ID.</p>' : '<p>You’ll enter it when you open Money Snapshot and when you come back to it.</p>') + '<p class="note">If you forget it' + (faceCan ? ' and Face ID can’t help' : '') +
    ', the only way back in is to delete the figures on this phone and open a copy you saved to Files. ' + (state.lastExport ? 'You last saved one on ' + esc(fmtDate(state.lastExport)) + '.' : 'You haven’t saved one yet, so it’s worth doing that first, in More.') + '</p>',
    () => { setTimeout(() => padOpen({ mode: 'new', done: lockReady }), 0); }, { label: 'Choose a passcode' });
}
function lockReady() {
  render();
  toast('Passcode on');
  if (!faceCan) return;
  openSheet('Face ID', '<p>Now turn on Face ID, so Money Snapshot opens with a glance. Your iPhone will offer to save a passkey: that’s how Face ID works for web apps. Your passcode still works whenever Face ID doesn’t.</p>', () => {
    faceAdd().then(() => { render(); toast('Face ID on'); }).catch(() => toast('Face ID wasn’t turned on'));
  }, { label: 'Turn on Face ID' });
}

/* ---------- start ---------- */
// The app doesn't zoom: double taps are taps (touch-action in the styles), and pinching is ignored.
['gesturestart', 'gesturechange'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
// Upright only: phones that allow it lock the screen; elsewhere the note above covers a sideways phone.
try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch (e) { /* not supported here */ }
applyTheme();
lock();
render(true);
recover();
setTimeout(checksMaybe, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(checksMaybe, 1500); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
